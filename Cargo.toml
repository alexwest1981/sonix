[package]
name = "sonix"
version = "0.9.226"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Linux DAW (Rust/egui) with timeline editing, synth, mixer, stem separation, plugin hosting and export."
repository = "https://github.com/alexwest1981/sonix"

[features]
# **Neural separation is on by default.** It was opt-in, and the result was a
# model picker that silently fell back to the DSP separator on every build that
# did not pass the feature — the user chose a model and got something else.
# A build that must stay dependency-free (or cannot download ONNX Runtime)
# turns it off: `cargo build --no-default-features --features plugin-host`.
default = ["neural"]
# ONNX Runtime is fetched as a prebuilt binary at build time (~100 MB, cached
# in ~/.cache/ort.pyke.io); runtimes newer than glibc 2.28 are required, which
# is why the release job builds with `--no-default-features`.
neural = ["dep:ort"]
# Opt-in CLAP plugin host (dlopen via libloading) with an out-of-process
# sandbox (shared-memory audio over memfd). Off by default so the normal build
# stays dependency-free; enable with `cargo build --features plugin-host`.
plugin-host = ["dep:libc"]
# Opt-in JACK backend (pro-audio routing, e.g. qjackctl/PipeWire-JACK). Off by
# default so the normal build never links or dlopens `libjack`: the cpal → ALSA
# → PipeWire path stays the one every user gets. Enable with
# `cargo build --features jack`.
jack = ["dep:jack"]
# Opt-in embedded Python for project scripts (`--features python`). Off by default, so the
# normal build never links libpython: `ldd target/release/sonix | grep python` stays empty.
# Enable with `cargo build --features python`.
python = ["dep:pyo3"]

[dependencies]
cpal = "0.15"
rtrb = "0.3"
eframe = { version = "0.29", features = ["accesskit"] }
crossterm = "0.28"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"  # sha256 för temaregistret; redan i låset via rustls
image = { version = "0.25", default-features = false, features = ["png"] }
flacenc = "0.5"
ureq = "2"

# Plattformens egen filväljare: Windows/macOS inbyggda dialoger och XDG-portalen
# på Linux. Ersätter `zenity` (Fas 7.1) — standardfeatures använder portalen, inte
# GTK3, så inga GTK-dev-huvuden behövs för att bygga.
rfd = "0.15"
# **laddas vid körning, inte vid bygge.** Skillnaden är hela poängen: ett länkat ORT kräver
# glibc ≥ 2.32, så manylinux-paketet (golv 2.28) kunde aldrig bära neural separation. Med
# `load-dynamic` öppnas `libonnxruntime.so` med dlopen i stället — binären startar utan den, och
# den som vill separera lägger filen i `~/.local/share/sonix/models/` eller sätter
# `ORT_DYLIB_PATH`. Funktionen säger ifrån med filnamnet om den saknas i stället för att panika.
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }
# dlopen for the optional plugin hosts **and** the optional Rubber Band stretch backend
# (`audio::rubber_band`), so it is compiled even when `plugin-host` is off. It only wraps the
# platform loader — no C headers, no link-time dependency.
libloading = "0.8"
libc = { version = "0.2", optional = true }
# JACK (`--features jack`): pro-audio routing and sample-accurate sync. Needs the
# C library and headers at build time, which is exactly why it is optional — the
# default build must stay free of libjack.
#
# `default-features = false` slår av cratets `dynamic_loading`: med den dlopen:ar
# `libjack.so` vid körning i stället för att länka, och då syns ingen JACK-beroende
# i `ldd` alls. Länkning är det som ska synas — ett bygge med `jack` får kräva
# biblioteket, och ett utan får inte nämna det.
jack = { version = "0.11", optional = true, default-features = false }
# Embedded CPython for `--features python` (project scripts in Python). `auto-initialize`
# brings the interpreter up on first use. 0.25 is the first release that takes Rust 2024 and
# Python 3.14 without warnings or forward-compat switches.
pyo3 = { version = "0.25", features = ["auto-initialize"], optional = true }

# ALSA är Linux-only: MIDI-klaviatur och MCU tar emot noter via ALSA-sequencern
# (Fas 7.1). Beroendet ligger därför bara på Linux, så att kratet kan byggas och
# checkas på andra plattformar — där svarar i stället stubbarna i
# `hardware_control.rs` (MCU) med ett begripligt fel. MIDI-klaviaturen gick över till
# `midir` i Fas 7.1 och behöver inte längre den här grenen.

# **MIDI-in på alla plattformar** (Fas 7.1). Windows: WinMM, macOS: CoreMIDI, Linux:
# ALSA-sequencern — samma backend som den Linux-specifika vägen använde, så inget byts
# ut mot något sämre. Att välja bort en andra implementation är hela poängen: med en
# väg försvinner de `cfg`-grenar som bara en av dem kunde prövas i.
midir = "0.11"
# **FFT för spektral flux** (Fas 8.7). Ren Rust, inga C-huvuden — alltså bygger
# Windows-benet utan nya verktyg. En egen DFT var alternativet, men för en
# stämma på några minuter är den storleksordningar för långsam, och spektral
# analys utan FFT är i praktiken alltid `rustfft` (samma val som aubio/librosa).
rustfft = "6.4.1"
rhai = { version = "1.27.0", default-features = false, features = ["std"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "ogg", "vorbis", "wav", "pcm", "isomp4"] }
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"


# **Dev-beroende med avsikt:** `signalsmith-stretch` (MIT) prövades som renderingsmotor för
# tidsskalningen (Fas 8.10 steg 2) och **förlorade domen** mot vår egen WSOLA — den smetar
# transienterna (fler falska anslag) även om den håller diskanten bättre. Siffrorna står i
# roadmapens 8.10 och provet är `the_two_engines_on_the_same_stems`.
#
# Den ligger här och inte under `[dependencies]` av två skäl: den ska inte kunna hamna i
# produktionsvägen av misstag, och den drar in ett **C++-bygge med bindgen**, som kräver
# libclang. Som dev-beroende behövs det bara av `cargo test` — `cargo build` och Windows-
# jobbets `cargo check` rör den aldrig.
[dev-dependencies]
signalsmith-stretch = "0.1.3"
