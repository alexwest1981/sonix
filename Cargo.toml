[package]
name = "sonix"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native Linux DAW (Rust/egui) with timeline editing, synth, mixer, stem separation, plugin hosting and export."
repository = "https://github.com/alexwest1981/sonix"

[features]
default = []
# Opt-in neural stem separation (HTDemucs via ONNX Runtime). Off by default so
# the normal build stays dependency-free and offline; enable with
# `cargo build --features neural`.
neural = ["dep:ort"]
# Opt-in CLAP plugin host (dlopen via libloading) with an out-of-process
# sandbox (shared-memory audio over memfd). Off by default so the normal build
# stays dependency-free; enable with `cargo build --features plugin-host`.
plugin-host = ["dep:libloading", "dep:libc"]

[dependencies]
cpal = "0.15"
rtrb = "0.3"
eframe = "0.29"
crossterm = "0.28"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
flacenc = "0.5"
ureq = "2"
# Plattformens egen filväljare: Windows/macOS inbyggda dialoger och XDG-portalen
# på Linux. Ersätter `zenity` (Fas 7.1) — standardfeatures använder portalen, inte
# GTK3, så inga GTK-dev-huvuden behövs för att bygga.
rfd = "0.15"
ort = { version = "2.0.0-rc.13", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

# ALSA är Linux-only: MIDI-klaviatur och MCU tar emot noter via ALSA-sequencern
# (Fas 7.1). Beroendet ligger därför bara på Linux, så att kratet kan byggas och
# checkas på andra plattformar — där svarar i stället stubbarna i
# `midi_input.rs` och `hardware_control.rs` med ett begripligt fel.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

# Utanför Linux är midir MIDI-backenden (Windows: WinMM, macOS: CoreMIDI). På
# Linux finns ALSA-seq-vägen redan och är den som används — midir blir den
# plattformsoberoende backenden, precis som Fas 7.1 beskrev.
[target.'cfg(not(target_os = "linux"))'.dependencies]
midir = "0.11"

