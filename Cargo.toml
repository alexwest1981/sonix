[package]
name = "sonix"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Opt-in neural stem separation (HTDemucs via ONNX Runtime). Off by default so
# the normal build stays dependency-free and offline; enable with
# `cargo build --features neural`.
neural = ["dep:ort"]
# Opt-in in-process CLAP plugin host (dlopen via libloading). Off by default so
# the normal build stays dependency-free; enable with
# `cargo build --features plugin-host`.
plugin-host = ["dep:libloading"]

[dependencies]
cpal = "0.15"
rtrb = "0.3"
eframe = "0.29"
crossterm = "0.28"
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
flacenc = "0.5"
alsa = "0.9"
ureq = "2"
ort = { version = "2.0.0-rc.13", optional = true }
libloading = { version = "0.8", optional = true }

