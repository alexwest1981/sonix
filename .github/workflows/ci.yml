name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# **Ett flöde per gren, inte ett per push.** Utan det startar varje push en egen full
# körning: sex commits i rad blir sex parallella körningar som slåss om samma runners, och
# den senaste — den som faktiskt gäller — står sist i kön. Den äldre avbryts i stället.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "plugin-host"]
    steps:
      - uses: actions/checkout@v4

      # apt på GitHubs runner kan hänga i evigheter på en seg spegel (sett två gånger:
      # 15+ minuter i det här steget medan de andra benen var klara). Tidsgränserna gör att
      # en seg spegel **faller snabbt** i stället, så en omkörning kostar en minut och inte
      # en kvart. `timeout-minutes` fångar fallet där apt självt inte ger upp.
      - name: Install system dependencies
        timeout-minutes: 6
        run: |
          # Redan installerat? Gör ingenting. Runnern har build-essential och pkg-config,
          # så det är bara ALSA som kan saknas.
          if pkg-config --exists alsa; then
            echo "ALSA finns redan — hoppar över apt"
            exit 0
          fi
          # **Tre försök med hårt tak per försök.** En seg spegel ska kosta en minut, inte
          # fyra: `timeout` dödar apt om det hänger och nästa försök börjar om. Resultatet
          # kontrolleras sist — ett tyst hopp över ett misslyckande vore värre än ett fel.
          for attempt in 1 2 3; do
            sudo timeout 60 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 \
              -o Acquire::https::Timeout=10 update || true
            if sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 \
              -o Acquire::https::Timeout=10 install -y --no-install-recommends \
              build-essential pkg-config libasound2-dev; then
              break
            fi
            echo "apt-försök $attempt gick inte igenom — försöker igen"
            sleep 5
          done
          pkg-config --exists alsa || { echo "ALSA-installationen misslyckades"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Repots krav är noll varningar, och det prövas nu även här — inte bara i
      # Windows-jobbet. Anledningen står i historiken: en commit med fem oanvända
      # metoder gick igenom Linux-benet (som inte brydde sig) och föll först i
      # Windows-jobbet. Varningen syntes lokalt och lästes förbi; nu fälls den av
      # bygget i stället.
      - name: Build (noll varningar)
        env:
          # **Färgen av är en del av grinden, inte kosmetika.** Cargo kan skriva ANSI-koder
          # före ordet, och då börjar raden med `\x1b[1m\x1b[33m` i stället för `warning`.
          CARGO_TERM_COLOR: never
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --locked --features "$FEATURES" 2>&1 | tee /tmp/build.log
          else
            cargo build --release --locked 2>&1 | tee /tmp/build.log
          fi
          # Remsa ANSI-koder och leta efter **ordet** `warning`, inte efter en rad som
          # börjar med det. Mätt 2026-09-15: plugin-host-benet skrev en riktig varning
          # (E0133) och jobbet var **grönt** — `^warning` såg den inte, för raden hade
          # ANSI-koder före ordet. En grind som missar en riktig varning är värre än ingen
          # grind: den ser ut som ett löfte. Falska träffar fäller bygget, och det är rätt
          # riktning.
          sed -r 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/build.log > /tmp/build.plain.log
          # **En grind som inte har sett något ska falla, inte tiga.** Ett tomt eller
          # oläsligt bygglogg såg förut ut precis som ett rent bygge.
          if ! grep -qE 'Compiling|Finished|Checking' /tmp/build.plain.log; then
            echo "::error::Byggloggen innehåller varken Compiling, Checking eller Finished — grinden kan inte lita på den"
            tail -20 /tmp/build.plain.log
            exit 1
          fi
          if grep -qE 'warning' /tmp/build.plain.log; then
            echo "::error::Varningar i bygget — repots krav är noll"
            grep -E 'warning' /tmp/build.plain.log
            exit 1
          fi

      # **Flerspråkigheten är en grind, inte en ambition:** appen finns på sju språk, alltså ska
      # README, .desktop och metainfo göra det också. Steget faller när ett språk saknas någonstans.
      - name: Docs and desktop languages match the UI
        run: bash packaging/check-docs-languages.sh

      - name: Test
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --release --locked --features "$FEATURES"
          else
            cargo test --release --locked
          fi

      # Fas 7.2: siffrorna ska synas i loggen, inte bara finnas som tröskel.
      # (Samma test körs redan i steget ovan och failar vid regress; det här
      # steget visar latens/CPU per buffertstorlek.)
      # Filtret är modulnamnet, inte ett enskilt testnamn: då rapporteras BÅDE
      # realtidsmätningen (7.2) och frysningsjämförelsen (8.1) i varje körning.
      - name: Realtids- och frysningsmätning (7.2 + 8.1)
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --release --locked --features "$FEATURES" audio::realtime_bench -- --nocapture
          else
            cargo test --release --locked audio::realtime_bench -- --nocapture
          fi

  neural:
    name: Build & test (neural, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # apt på GitHubs runner kan hänga i evigheter på en seg spegel (sett två gånger:
      # 15+ minuter i det här steget medan de andra benen var klara). Tidsgränserna gör att
      # en seg spegel **faller snabbt** i stället, så en omkörning kostar en minut och inte
      # en kvart. `timeout-minutes` fångar fallet där apt självt inte ger upp.
      - name: Install system dependencies
        timeout-minutes: 6
        run: |
          if pkg-config --exists alsa; then
            echo "ALSA finns redan — hoppar över apt"
            exit 0
          fi
          for attempt in 1 2 3; do
            sudo timeout 60 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 \
              -o Acquire::https::Timeout=10 update || true
            if sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 \
              -o Acquire::https::Timeout=10 install -y --no-install-recommends \
              build-essential pkg-config libasound2-dev; then
              break
            fi
            echo "apt-försök $attempt gick inte igenom — försöker igen"
            sleep 5
          done
          pkg-config --exists alsa || { echo "ALSA-installationen misslyckades"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with the opt-in neural feature
        run: cargo test --release --locked --features neural

  # Fas 7.1: portabiliteten mäts på en riktig Windows-maskin. Där finns MSVC, så
  # byggskripten (ring m.fl.) går igenom — till skillnad från en korscheck från
  # Linux, som stoppar redan i ring.
  #
  # Jobbet var icke-blockerande medan porten pågick. Det är det inte längre: hela
  # kratet checkar och bygger på Windows med noll varningar, så nu håller jobbet
  # porten kvar i stället för att bara visa hur långt den kommit.
  windows-check:
    name: cargo check + build (Windows, Fas 7.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Runnern är redan x86_64-pc-windows-msvc, så det här är exakt kriteriet i
      # Fas 7.1: `cargo check --target x86_64-pc-windows-msvc`. Steget failar
      # också på varningar: repots krav är noll, och en varning på Windows som
      # ingen ser är hur porten tystnar.
      - name: cargo check (Windows, noll varningar)
        run: |
          cargo check --locked 2>&1 | Tee-Object -Variable out
          if ($out -match 'warning') { Write-Error "Varningar i Windows-bygget"; exit 1 }
        shell: pwsh

      # Ett steg längre än check: det här länkar fram en riktig sonix.exe. Det som
      # INTE kan mätas här är att den startar, spelar ljud och tar emot MIDI — en
      # runner har varken skärm eller ljudenhet. Det kräver en riktig Windows-maskin
      # (utskrivet i ROADMAP.md, Fas 7.1).
      - name: cargo build (Windows, länkar en .exe)
        run: |
          cargo build --locked --release
          Get-Item target/release/sonix.exe | Select-Object Name,Length
        shell: pwsh

      # Artefakten gör kriteriets sista del möjlig: någon måste kunna köra den på
      # en riktig Windows-maskin, eftersom en runner varken har skärm eller
      # ljudenhet. Hämtas med `gh run download <run-id> -n sonix-windows`.
      - name: Ladda upp sonix.exe
        uses: actions/upload-artifact@v4
        with:
          name: sonix-windows
          path: target/release/sonix.exe
          if-no-files-found: error

  # **Portabilitetsgrinden.** Binären byggs i en miljö med glibc 2.28 och grinden faller om
  # någon symbol kräver nyare. Mätt 2026-10-25: en binär byggd på Arch begärde GLIBC_2.44 och
  # startade därför inte ens på Ubuntu 24.04 (2.39) — en release som "fungerar på min maskin".
  glibc-golv:
    name: glibc 2.28 + paket (deb/rpm/AppImage)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Verktyg (ALSA-huvuden + rust)
        timeout-minutes: 12
        run: |
          dnf install -y alsa-lib-devel pkgconf-pkg-config
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cacha cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: glibc228

      - name: Bygg
        env:
          CARGO_TARGET_DIR: /tmp/target
        run: cargo build --release --locked --features plugin-host

      - name: Grind — glibc-golvet
        run: bash packaging/check-glibc-floor.sh /tmp/target/release/sonix 2.28

      - name: Ladda upp binären
        uses: actions/upload-artifact@v4
        with:
          name: sonix-glibc228
          path: /tmp/target/release/sonix
          if-no-files-found: error

  # Paketen byggs på en vanlig runner: nfpm och appimagetool är vanliga program, och
  # binären kommer färdig från grinden ovan.
  paket:
    name: deb + rpm + AppImage
    needs: glibc-golv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hämta binären
        uses: actions/download-artifact@v4
        with:
          name: sonix-glibc228
          path: target/release

      - name: Bygg paketen
        run: |
          set -euo pipefail
          mkdir -p dist
          # **Versionen är pinnad, inte "latest":** `releases/latest/download/<fil>` kräver att
          # filnamnet är exakt detsamma i varje release, och nfpm döper sina filer med
          # versionsnummer — mätt: länken gav 404 och hela paketjobbet föll.
          curl -fsSL -o /tmp/nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          ( cd /tmp && ar x nfpm.deb && tar -xf data.tar.gz )
          NPFM=/tmp/usr/bin/nfpm
          V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          VERSION="$V" ARCH=amd64 "$NPFM" package -f packaging/nfpm.yaml -p deb \
            -t "$PWD/dist/sonix_${V}_amd64.deb"
          VERSION="$V" ARCH=x86_64 "$NPFM" package -f packaging/nfpm.yaml -p rpm \
            -t "$PWD/dist/sonix-${V}-1.x86_64.rpm"
          bash packaging/build-appimage.sh

      - name: Ladda upp paketen
        uses: actions/upload-artifact@v4
        with:
          name: sonix-paket
          path: dist/*
          if-no-files-found: error

  # **Beviset.** Installerar paketet i fyra riktiga distributioner och startar appen med Xvfb.
  # En grön grind säger att binären *får* köras där; den här säger att den *gör* det.
  distributioner:
    name: Startar på ${{ matrix.image }}
    needs: paket
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04", "fedora:41", "rockylinux:9"]
    steps:
      - uses: actions/checkout@v4

      - name: Hämta paketen
        uses: actions/download-artifact@v4
        with:
          name: sonix-paket
          path: dist

      - name: Installera och starta
        run: bash packaging/verify-in-docker.sh "${{ matrix.image }}"
