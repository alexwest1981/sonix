name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.features || 'default' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "plugin-host"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --locked --features "$FEATURES"
          else
            cargo build --release --locked
          fi

      - name: Test
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --release --locked --features "$FEATURES"
          else
            cargo test --release --locked
          fi

      # Fas 7.2: siffrorna ska synas i loggen, inte bara finnas som tröskel.
      # (Samma test körs redan i steget ovan och failar vid regress; det här
      # steget visar latens/CPU per buffertstorlek.)
      - name: Realtidsmätning (Fas 7.2)
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo test --release --locked --features "$FEATURES" realtime_budget -- --nocapture
          else
            cargo test --release --locked realtime_budget -- --nocapture
          fi

  neural:
    name: Build & test (neural, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test with the opt-in neural feature
        run: cargo test --release --locked --features neural

  # Fas 7.1: portabiliteten mäts på en riktig Windows-maskin. Där finns MSVC, så
  # byggskripten (ring m.fl.) går igenom — till skillnad från en korscheck från
  # Linux, som stoppar redan i ring. Jobbet är icke-blockerande medan porten
  # pågår: det visar hur långt den kommer i stället för att gissa. När allt utom
  # plugin-GUI:t checkar flyttas det in i den blockerande kön.
  windows-check:
    name: cargo check (Windows, Fas 7.1 — icke-blockerande)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Runnern är redan x86_64-pc-windows-msvc, så det här är exakt kriteriet i
      # Fas 7.1: `cargo check --target x86_64-pc-windows-msvc`.
      - name: cargo check (Windows)
        run: cargo check --locked
