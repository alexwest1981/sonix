name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # **glibc-golvet sätts av bygg-Imagen, inte av runnern.** Ubuntu-runners ger
          # glibc 2.35 (22.04) respektive 2.39 (24.04), så en binär därifrån startar inte på
          # Debian 11 eller RHEL 8. manylinux_2_28 har glibc 2.28 och samma arkitektur native —
          # ingen korsning, som alsa-sys inte klarar.
          - runner: ubuntu-latest
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make pkgconf-pkg-config alsa-lib-devel alsa-lib \
            binutils tar gzip curl which

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Test
        run: cargo test --release --locked --features plugin-host

      - name: Build
        run: cargo build --release --locked --features plugin-host

      # Grinden: en binär som begär nyare glibc än bygg-Imagen får aldrig bli en release.
      - name: Check the glibc floor
        run: bash packaging/check-glibc-floor.sh target/release/sonix 2.28

      # Fyra former av samma binär. Ett tarball räcker inte: folk installerar med
      # `apt`/`dnf`, och den som inte vill installera något alls vill ha en AppImage.
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.arch }}"
          name="sonix-${version}-${arch}-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          cp target/release/sonix "dist/${name}/"
          strip --strip-unneeded "dist/${name}/sonix" || true
          cp README.md README_SV.md CHANGELOG.md CHANGELOG-DETAIL.md MANUAL.md \
             LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

          # nfpm finns bara som .deb; plocka ut binären med ar (finns i binutils).
          if [ ! -x /tmp/nfpm ]; then
            curl -fsSL -o /tmp/nfpm.deb \
              https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb || true
            ( cd /tmp && ar x nfpm.deb && tar -xf data.tar.gz && cp usr/bin/nfpm /tmp/nfpm ) || true
          fi
          if [ -x /tmp/nfpm ]; then
            VERSION="$version" ARCH="${{ matrix.deb_arch }}" /tmp/nfpm package \
              -f packaging/nfpm.yaml -p deb -t "$PWD/dist/sonix_${version}_${{ matrix.deb_arch }}.deb"
            VERSION="$version" ARCH="${{ matrix.rpm_arch }}" /tmp/nfpm package \
              -f packaging/nfpm.yaml -p rpm -t "$PWD/dist/sonix-${version}-1.${{ matrix.rpm_arch }}.rpm"
          else
            echo "nfpm kunde inte hämtas — hoppar över deb/rpm för $arch" >&2
          fi

          # AppImage bara där verktygen finns för arkitekturen.
          if [ "$arch" = "x86_64" ] && curl -fsSL -o /dev/null -I \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage; then
            ARCH="$arch" bash packaging/build-appimage.sh || echo "AppImage-bygget gick inte igenom" >&2
          fi

          ( cd dist && sha256sum -- * > SHA256SUMS )
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install gh
        run: |
          dnf install -y tar gzip
          curl -fsSL -o /tmp/gh.tgz \
            "https://github.com/cli/cli/releases/latest/download/gh_$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | sed -n 's/.*"tag_name": "v\([^"]*\)".*/\1/p' | head -1)_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tgz -C /tmp && cp /tmp/gh_*/bin/gh /usr/local/bin/gh

      - name: Download both builds
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && (index($0, "## [") == 1 || index($0, "]: ") > 0) { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for ${version}; will fall back to generated notes."
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          assets=(dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/SHA256SUMS)
          present=()
          for a in "${assets[@]}"; do [ -e "$a" ] && present+=("$a"); done
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "${GITHUB_REF_NAME}" "${present[@]}" \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" "${present[@]}" \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
