name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          # ARM-builden körs på en arm-runner i stället för att korsas fram: alsa-sys
          # behöver ett riktigt aarch64-sysroot, och cross-Images saknar libasound2-dev.
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Test
        run: cargo test --release --locked --features plugin-host

      - name: Build
        run: cargo build --release --locked --features plugin-host

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.arch }}"
          name="sonix-${version}-${arch}-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          cp target/release/sonix "dist/${name}/"
          strip --strip-unneeded "dist/${name}/sonix" || true
          cp README.md README_SV.md CHANGELOG.md CHANGELOG-DETAIL.md MANUAL.md \
             LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download both builds
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && (index($0, "## [") == 1 || index($0, "]: ") > 0) { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for ${version}; will fall back to generated notes."
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
