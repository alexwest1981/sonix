name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # **Bygget sker i containern, paketeringen på en vanlig runner.** Containerjobbet har
  # glibc 2.28 (golvet) men saknar verktygen som gör .deb/.rpm/AppImage; runnerjobbet har dem
  # men fel glibc. Dela på det i stället för att blanda — samma uppdelning som ci.yml kör,
  # och där är båda jobben gröna.
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # glibc-golvet kommer från imagen. Utöver det: gcc-c++ för C++-källorna och
          # **libclang** för bindgen (`signalsmith-stretch` genererar bindningar) — utan
          # libclang stannar bygget på "Unable to find libclang".
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake clang clang-libs pkgconf-pkg-config alsa-lib-devel alsa-lib \
            binutils tar gzip curl which

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Test
        run: cargo test --release --locked --features plugin-host

      - name: Build
        run: cargo build --release --locked --features plugin-host

      - name: Check the glibc floor
        run: bash packaging/check-glibc-floor.sh target/release/sonix 2.28

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: target/release/sonix
          if-no-files-found: error

  package:
    name: Package (deb, rpm, AppImage, tarball)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          curl -fsSL -o /tmp/nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb
          ( cd /tmp && ar x nfpm.deb && tar -xf data.tar.gz )
          NPFM=/tmp/usr/bin/nfpm

          for arch in x86_64 aarch64; do
            name="sonix-${version}-${arch}-unknown-linux-gnu"
            mkdir -p "dist/${name}"
            cp "bins/bin-${arch}/sonix" "dist/${name}/sonix"
            chmod +x "dist/${name}/sonix"
            # x86-strip kan inte läsa en aarch64-binär; den biten är kosmetisk.
            strip --strip-unneeded "dist/${name}/sonix" 2>/dev/null || true
            cp README.md README_SV.md CHANGELOG.md CHANGELOG-DETAIL.md MANUAL.md \
               LICENSE CONTRIBUTING.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            bash packaging/check-glibc-floor.sh "dist/${name}/sonix" 2.28

            # **nfpm läser sina sökvägar relativt repot**, så binären måste ligga på den plats
            # nfpm.yaml pekar ut precis när paketet byggs. Arkitekturnamnen skiljer sig mellan
            # formaten (amd64/arm64 för deb, x86_64/aarch64 för rpm).
            mkdir -p target/release
            cp "bins/bin-${arch}/sonix" target/release/sonix
            case "$arch" in
              x86_64) deb_arch=amd64; rpm_arch=x86_64 ;;
              aarch64) deb_arch=arm64; rpm_arch=aarch64 ;;
            esac
            VERSION="$version" ARCH="$deb_arch" "$NPFM" package -f packaging/nfpm.yaml -p deb \
              -t "$PWD/dist/sonix_${version}_${deb_arch}.deb"
            VERSION="$version" ARCH="$rpm_arch" "$NPFM" package -f packaging/nfpm.yaml -p rpm \
              -t "$PWD/dist/sonix-${version}-1.${rpm_arch}.rpm"
          done

          # AppImage för x86_64 (verktygen finns bara där); dess skript läser target/release/sonix.
          cp bins/bin-x86_64/sonix target/release/sonix
          ARCH=x86_64 bash packaging/build-appimage.sh
          ( cd dist && sha256sum -- *.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS )
          ls -la dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && (index($0, "## [") == 1 || index($0, "]: ") > 0) { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG entry for ${version}; will fall back to generated notes."
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          # **Bara filer, aldrig kataloger:** `dist/*` tar med AppDir-mappen och
          # tarball-mapparna, och då faller hela publiceringen på "read ...: is a directory"
          # *efter* att alla paket byggts.
          files=(dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/SHA256SUMS)
          present=()
          for f in "${files[@]}"; do [ -f "$f" ] && present+=("$f"); done
          # **Idempotent:** en tidigare körning kan ha hunnit skapa releasen innan en
          # tillgångsmall föll. Då laddas filerna upp i stället för att releasen skapas om.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${present[@]}" --clobber
          elif [ -s RELEASE_NOTES.md ]; then
            gh release create "${GITHUB_REF_NAME}" "${present[@]}" \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" "${present[@]}" \
              --title "Sonix Studio ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
